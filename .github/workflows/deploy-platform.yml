name: Deploy Platform to Firebase

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: firebase-platform-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENWARNDE }}

      - name: Install platform dependencies
        working-directory: apps/web
        run: |
          set -euxo pipefail
          echo '::group::Node and npm versions'
          node --version
          npm --version
          echo '::endgroup::'
          echo '::group::Install dependencies'
          npm ci --loglevel=verbose
          echo '::endgroup::'

      - name: Build platform
        working-directory: apps/web
        run: |
          set -euxo pipefail
          echo '::group::Build platform'
          npm run build
          echo '::endgroup::'

      - name: Verify platform export
        run: |
          set -euxo pipefail
          echo '::group::Verify apps/web/out'
          test -d apps/web/out
          test -f apps/web/out/index.html
          printf 'Export contains %s files\n' "$(find apps/web/out -type f | wc -l)"
          find apps/web/out -maxdepth 2 -type f | sort | head -100
          echo '::endgroup::'

      - name: Deploy platform hosting target
        run: |
          set -euxo pipefail
          echo '::group::Deploy hosting:platform'
          npx --yes firebase-tools@latest deploy \
            --only hosting:platform \
            --project openwarnde \
            --non-interactive \
            --debug
          echo '::endgroup::'